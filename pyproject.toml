[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "treqs-cli"
version = "0.1.0"
description = "Command-line control plane for the TReqs platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "TReqs AI" },
    { name = "Trevor", email = "trevor@treqs.ai" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["cli", "machine-learning", "mlops", "training", "treqs"]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
    "pydantic>=2.6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/treqs/treqs-cli"
Repository = "https://github.com/treqs/treqs-cli"
Issues = "https://github.com/treqs/treqs-cli/issues"

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
treqs = "treqs_cli.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra"
markers = [
    "e2e: end-to-end tests that exercise the CLI as a subprocess",
    "local_api: tests that require a locally running treqs-api and database",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["src/treqs_cli", "tests"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
