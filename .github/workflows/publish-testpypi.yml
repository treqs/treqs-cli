name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and validate without uploading"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify distribution set
        run: |
          python - <<'PY'
          import glob
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = {
              f"dist/treqs_cli-{version}-py3-none-any.whl",
              f"dist/treqs_cli-{version}.tar.gz",
          }
          found = set(glob.glob("dist/*"))

          print("Distribution files:")
          for path in sorted(found):
              print(f"  - {path}")

          if found != expected:
              raise SystemExit(
                  f"Expected {sorted(expected)}, found {sorted(found)}"
              )
          PY

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke test wheel
        run: |
          wheel="$(realpath dist/*.whl)"
          smoke_dir="$(mktemp -d)"
          python -m venv "${smoke_dir}/venv"
          "${smoke_dir}/venv/bin/python" -m pip install "${wheel}"
          (
            cd "${smoke_dir}"
            "${smoke_dir}/venv/bin/treqs" --help >/dev/null
            "${smoke_dir}/venv/bin/treqs" --version
            "${smoke_dir}/venv/bin/python" - <<'PY'
          from importlib.metadata import version

          import treqs_cli

          distribution_version = version("treqs-cli")
          if treqs_cli.__version__ != distribution_version:
              raise SystemExit(
                  f"Version mismatch: treqs_cli.__version__={treqs_cli.__version__} "
                  f"distribution={distribution_version}"
              )
          PY
          )

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  publish:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    needs: build
    environment: testpypi

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upload tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload to TestPyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: python -m twine upload --repository testpypi dist/*
