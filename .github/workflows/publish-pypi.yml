name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version matches release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          release_version = os.environ["RELEASE_TAG"].removeprefix("v")

          print(f"Package version: {package_version}")
          print(f"Release tag version: {release_version}")

          if package_version != release_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={package_version} "
                  f"release_tag={release_version}"
              )
          PY

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify distribution set
        run: |
          python - <<'PY'
          import glob
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = {
              f"dist/treqs_cli-{version}-py3-none-any.whl",
              f"dist/treqs_cli-{version}.tar.gz",
          }
          found = set(glob.glob("dist/*"))

          print("Distribution files:")
          for path in sorted(found):
              print(f"  - {path}")

          if found != expected:
              raise SystemExit(
                  f"Expected {sorted(expected)}, found {sorted(found)}"
              )
          PY

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke test wheel
        run: |
          wheel="$(realpath dist/*.whl)"
          smoke_dir="$(mktemp -d)"
          python -m venv "${smoke_dir}/venv"
          "${smoke_dir}/venv/bin/python" -m pip install "${wheel}"
          (
            cd "${smoke_dir}"
            "${smoke_dir}/venv/bin/treqs" --help >/dev/null
            "${smoke_dir}/venv/bin/treqs" --version
            "${smoke_dir}/venv/bin/python" - <<'PY'
          from importlib.metadata import version

          import treqs_cli

          distribution_version = version("treqs-cli")
          if treqs_cli.__version__ != distribution_version:
              raise SystemExit(
                  f"Version mismatch: treqs_cli.__version__={treqs_cli.__version__} "
                  f"distribution={distribution_version}"
              )
          PY
          )

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      contents: write

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install upload tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install twine

      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*

      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}" dist/*
          --clobber --repo "${{ github.repository }}"
